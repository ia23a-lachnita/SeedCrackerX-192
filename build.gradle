plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven { url "https://maven.shedaniel.me/" }
    maven { url "https://maven.latticg.com/" }
    maven { url "https://maven.seedfinding.com/" }
    maven { url "https://maven-snapshots.seedfinding.com/" }
    maven { url "https://jitpack.io" }
    maven { url = 'https://maven.minecraftforge.net/' }
}

configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    implementation fg.deobf("me.shedaniel.cloth:cloth-config-forge:7.0.72")

    // Shade these dependencies to avoid conflicts
    shade "com.seedfinding:mc_math:1.171.0"
    shade "com.seedfinding:mc_seed:1.171.2"
    shade "com.seedfinding:mc_core:1.200.0"
    shade "com.seedfinding:mc_noise:1.171.1"
    shade "com.seedfinding:mc_biome:1.171.1"
    shade "com.seedfinding:mc_terrain:1.171.1"
    shade "com.seedfinding:mc_feature:1.171.7"
    shade "com.seedfinding:mc_reversal:1.171.1"
    shade "com.seedfinding:latticg:1.06"
}

shadowJar {
    configurations = [project.configurations.shade]
    archiveClassifier.set('all')

    // Relocate packages to avoid conflicts
    relocate 'com.seedfinding', 'kaptainwutax.seedcrackerX.relocate.seedfinding'

    // Exclude common files that might cause conflicts
    exclude 'META-INF/maven/**'
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'module-info.class'

    minimize()
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'Side': 'CLIENT'
        ])
    }
}

reobf {
    shadowJar {
        dependsOn createMcpToSrg
    }
}

// Configure task dependencies properly
build {
    dependsOn shadowJar
}

shadowJar {
    dependsOn jar
}

reobfShadowJar {
    dependsOn shadowJar
}

tasks.build.dependsOn reobfShadowJar

publishing {
    publications {
        mavenJava(MavenPublication) {
            // point to the jar file produced by the reobfShadowJar task:
            artifact(
                    tasks.named('reobfShadowJar').flatMap { it.archiveFile }
            ) {
                // optional: remove the "all" classifier if you want it to be the primary artifact
                classifier = null
            }
        }
    }
    repositories {
        maven {
            // use uri() so Gradle treats this as a file repo
            url = uri("$projectDir/mcmodsrepo")
        }
    }
}


tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

mixin {
    config 'seedcracker.mixins.json'
}